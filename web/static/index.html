<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>АРТА: Башня</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage"></canvas>
<div id="flash"></div>

<!-- ===== HUD ===== -->
<div id="hud" class="hidden">
  <header id="topbar">
    <button class="tb-btn" data-act="pause" aria-label="Пауза">❚❚</button>
    <div class="tb-cell"><span class="k">ВРЕМЯ</span><span class="v" id="hTime">00:00</span></div>
    <div class="tb-cell grow"><span class="k">ПРОЧНОСТЬ БАТАРЕИ</span><div class="bar"><i id="hInt"></i></div></div>
    <div class="tb-cell"><span class="k">СНАРЯДЫ</span><span class="v"><b>ОФ</b> <span id="hHe">0</span> &nbsp;<b>ББ</b> <span id="hAp">0</span></span></div>
    <button class="tb-cell tgt" data-act="nextTarget"><span class="k">ЦЕЛЬ ▸</span><span class="v" id="hTarget">—</span></button>
    <button class="tb-btn" id="hSpeed" data-act="speed">×1</button>
    <button class="tb-btn wide" data-act="notebook">БЛОКНОТ<i id="hUnread"></i></button>
  </header>
  <div id="radio"></div>
  <div id="toast"></div>
  <div id="flightChip" class="hidden"></div>
  <footer id="bottombar">
    <div id="info"><span id="memo"></span><span id="hint"></span></div>
    <nav id="nav"></nav>
  </footer>
</div>

<!-- ===== ЭКРАНЫ ===== -->
<section id="loading" class="screen show"><div class="load-box"><div class="logo-t">АРТА</div><div class="logo-s">БАШНЯ</div><div id="loadMsg">ЗАГРУЗКА…</div></div></section>

<section id="menu" class="screen">
  <div class="menu-box">
    <div class="logo-t">АРТА</div><div class="logo-s">БАШНЯ · БЕРЕГОВАЯ БАТАРЕЯ «УТЁС»</div>
    <div class="menu-btns">
      <button class="btn primary" data-act="campaign">КАМПАНИЯ</button>
      <button class="btn" data-act="skirmish">СВОБОДНЫЙ БОЙ</button>
      <button class="btn" data-act="howto">КАК ИГРАТЬ</button>
    </div>
    <div class="menu-opts">
      <div class="opt"><span>СЛОЖНОСТЬ</span><div class="seg" id="diffSeg"><button data-diff="0">КУРСАНТ</button><button data-diff="1">КОМАНДИР</button></div></div>
      <div class="opt"><span>ЗВУК</span><div class="seg" id="soundSeg"><button data-sound="1">ВКЛ</button><button data-sound="0">ВЫКЛ</button></div></div>
    </div>
    <div class="menu-hint" id="diffHint"></div>
  </div>
</section>

<section id="missions" class="screen">
  <div class="sheet wide">
    <div class="sheet-head"><h2>КАМПАНИЯ</h2><button class="btn small" data-act="toMenu">НАЗАД</button></div>
    <div id="missionGrid"></div>
  </div>
</section>

<section id="dialog" class="screen"><div class="sheet"><div id="dlgBody"></div><div id="dlgBtns" class="dlg-btns"></div></div></section>

<section id="notebook" class="screen">
  <div class="sheet wide paper">
    <div class="sheet-head"><h2>БЛОКНОТ ОПЕРАТОРА</h2><button class="btn small" data-act="closeNotebook">ЗАКРЫТЬ</button></div>
    <div class="nb-cols">
      <div class="nb-col"><h3>ЦЕЛИ И ЗАМЕРЫ</h3><div id="nbTargets"></div><h3>ВЫЧИСЛИТЕЛЬ</h3><div id="nbComputer"></div><h3>БАТАРЕЯ</h3><div id="nbBattery"></div></div>
      <div class="nb-col"><h3>РАДИОЖУРНАЛ</h3><div id="nbRadio"></div></div>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
