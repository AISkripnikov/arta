plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arta.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.arta.game'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'

        // Откуда приложение берёт обновления игры «по воздуху» (каталог ota/ в репозитории).
        // Пустая строка отключает обновления.
        buildConfigField 'String', 'UPDATE_URL', '"https://raw.githubusercontent.com/AISkripnikov/arta/claude/kind-darwin-oxqzge/ota/"'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подписывается debug-ключом, чтобы APK можно было сразу установить.
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
